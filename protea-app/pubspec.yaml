name: cricket_app
description: "Cricket Match Management App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.3.0
  provider: ^6.1.0
  intl: ^0.20.2
  fl_chart: ^1.2.0
  google_fonts: ^8.1.0
  flutter_animate: ^4.5.0
  image_picker: ^1.2.1
  lottie: ^3.1.0
  pdf: ^3.11.1
  path_provider: ^2.1.5
  printing: ^5.13.4
  share_plus: ^13.1.0
  url_launcher: ^6.2.0
  socket_io_client: ^2.0.3+1
  flutter_colorpicker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Future_Protea_Logo.png"
  adaptive_icon_background: "#1B5E20"
  adaptive_icon_foreground: "assets/images/Future_Protea_Logo.png"
  min_sdk_android: 21
  # Remove default padding to prevent zoomed appearance
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/lottie/
