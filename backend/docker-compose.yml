version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: cricket_match_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
